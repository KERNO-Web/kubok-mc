<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#000}
div{position:relative;width:600px;height:600px;background:url(../assets/hunt-board2.webp) -300px -220px/1254px 1254px;transform:scale(6);transform-origin:0 0;image-rendering:pixelated}
i{position:absolute;top:0;bottom:0;border-left:.2px solid #0f0}b{position:absolute;left:0;right:0;border-top:.2px solid #0f0}
s{position:absolute;color:#0f0;font:3px monospace;text-decoration:none}</style>
<div id="d"></div>
<script>const d=document.getElementById('d');for(let v=0;v<=100;v+=10){d.insertAdjacentHTML('beforeend',`<i style="left:${v}px"></i><b style="top:${v}px"></b><s style="left:${v}px;top:0">${300+v}</s><s style="top:${v}px;left:0">${220+v}</s>`)}</script>
